name: App

on:
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le dossier android si absent
        run: test -d android || flutter create . --platforms=android --org ci.cyberpath
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cyberpath-ci-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
