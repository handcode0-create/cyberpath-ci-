name: Contenu

on:
  pull_request:
    paths: ["content/**", "tools/**", "app/assets/content/**"]
  push:
    branches: [main]
    paths: ["content/**", "tools/**", "app/assets/content/**"]
  schedule:
    - cron: "17 6 * * 1"   # chaque lundi : détecte les liens morts
  workflow_dispatch:

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Schéma et cohérence
        run: python3 tools/validate_content.py
      - name: Copie embarquée à jour
        run: python3 tools/sync_content.py --check

  liens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Liens morts
        run: python3 tools/check_links.py
